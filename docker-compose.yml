# Local / self-hosted production-like stack.
# For Cloud Run + Cloud SQL deployment, see README.md and docs/deployment.md
# instead — this compose file is for running everything on one host
# (a VM, or local testing of the full architecture).
#
# Usage:
#   cp .env.example .env   # fill in real values
#   docker compose up -d --build
#   docker compose exec app node scripts/seed-pricing.js   # first run only

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://axtec:${DB_PASSWORD:-axtec_dev_password}@postgres:5432/axtec
      REDIS_URL: redis://redis:6379
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: axtec
      POSTGRES_PASSWORD: ${DB_PASSWORD:-axtec_dev_password}
      POSTGRES_DB: axtec
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axtec"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Mount real certs and uncomment 443 for HTTPS termination — see
      # docs/deployment.md. Behind Cloudflare, TLS can also terminate there.
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
