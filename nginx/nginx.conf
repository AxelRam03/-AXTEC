# Reverse proxy in front of the Node app.
# In production this normally sits behind Cloudflare (CDN/WAF) — see
# docs/deployment.md for the full chain: Cloudflare -> Nginx -> app.

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    client_max_body_size 1m;

    # Static assets (widget JS/CSS, images) — long cache, immutable.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|avif|woff2?)$ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API — never cache, always hit the app fresh.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    # Everything else (the site, the demo page).
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
